<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>카드 등록 처리 중</title>
  <style>
    body { font-family: 'Noto Sans KR', sans-serif; display:flex; align-items:center; justify-content:center; min-height:100vh; margin:0; background:#f8f9fa; }
    .card { background:#fff; border-radius:12px; padding:32px 40px; box-shadow:0 4px 20px rgba(0,0,0,0.1); text-align:center; max-width:400px; }
    .icon { font-size:48px; margin-bottom:16px; }
    h2 { font-size:20px; margin:0 0 8px; color:#1b4332; }
    p { font-size:14px; color:#6c757d; margin:0; }
  </style>
</head>
<body>
<div class="card">
  <div class="icon" id="icon">⏳</div>
  <h2 id="title">카드 등록 처리 중...</h2>
  <p id="msg">잠시 기다려주세요</p>
</div>
<script>
(async () => {
  const params = new URLSearchParams(location.search);
  const authKey     = params.get('authKey');
  const customerKey = params.get('customerKey');
  const subId       = params.get('subId');

  if (!authKey || !customerKey || !subId) {
    document.getElementById('icon').textContent = '❌';
    document.getElementById('title').textContent = '잘못된 요청';
    document.getElementById('msg').textContent = '파라미터가 없습니다.';
    return;
  }

  try {
    const res = await fetch(`/api/subscriptions/${subId}/billing-confirm`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      credentials: 'include',
      body: JSON.stringify({ authKey, customerKey }),
    });
    const json = await res.json();
    if (!res.ok) throw new Error(json.error || '실패');

    document.getElementById('icon').textContent = '✅';
    document.getElementById('title').textContent = '카드 등록 완료!';
    document.getElementById('msg').textContent = '3초 후 관리 화면으로 이동합니다.';
    setTimeout(() => { location.href = '/#subscriptions'; }, 3000);
  } catch (e) {
    document.getElementById('icon').textContent = '❌';
    document.getElementById('title').textContent = '카드 등록 실패';
    document.getElementById('msg').textContent = e.message;
    setTimeout(() => { location.href = '/#subscriptions'; }, 4000);
  }
})();
</script>
</body>
</html>
